llm:
  mode: live                      # live | mock
  base_url: http://localhost:1234/v1
  api_key: lm-studio
  model: qwen3-coder-30b-a3b-instruct
  timeout: 300
  temperature: 0.0
  max_tokens: 900
models:
  embedder: BAAI/bge-large-en-v1.5
  reranker: BAAI/bge-reranker-large
  device: cuda
  fp16: true
  embed_batch_size: 32
  rerank_batch_size: 16
chunking:
  chunk_tokens: 512
  overlap_tokens: 64
retrieval:
  dense_k: 25
  sparse_k: 25
  rrf_k: 60
  rrf_weights: {dense: 1.0, sparse: 1.0}
  rerank_in: 25
  final_k: 5
  min_rerank_score: 0.02         # sigmoid cross-encoder score; top chunk below this -> refuse
  max_queries: 3
paths:
  raw: data/raw
  processed: data/processed
  chunks: data/processed/chunks.jsonl
  bm25: data/processed/bm25_index.pkl
  chroma: data/processed/chroma_db
  outputs: outputs
  golden: tests/golden_qa.json
chroma:
  collection: hospitality_marketing
seed: 42
